<!DOCTYPE html>
<html>
<head>
    <title>Tech Fest 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        h1 { color: #333; }
        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tech Fest 2026</h1>
        <p>Register for our exciting event!</p>
        <form>
            <input type="text" placeholder="Enter Your Name" required>
            <input type="email" placeholder="Enter Your Email" required>
            <select>
                <option>Choose Event</option>
                <option>Web Development</option>
                <option>AI Workshop</option>
                <option>Hackathon</option>
                <option>Gaming Competition</option>
            </select>
            <br>
            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
